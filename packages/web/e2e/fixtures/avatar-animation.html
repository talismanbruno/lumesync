<!doctype html><html><body style="background:#181820;padding:40px"><div id="root"></div><script type="module">
import React,{useState} from 'react'; import {createRoot} from 'react-dom/client';
import {Avatar} from '/src/components/ui/Avatar.tsx'; import '/src/styles/globals.css';
const params=new URLSearchParams(location.search); const ids=[params.get('first'),params.get('second')];
const OriginalDecoder=window.ImageDecoder;
window.animationProbe={decodes:0,openDecoders:0,closedDecoders:0};
if(OriginalDecoder)window.ImageDecoder=class extends OriginalDecoder{
 constructor(options){super(options);window.animationProbe.openDecoders++}
 decode(options){window.animationProbe.decodes++;return super.decode(options)}
 close(){window.animationProbe.openDecoders--;window.animationProbe.closedDecoders++;super.close()}
};
function Probe(){const [talking,setTalking]=useState(false),[profile,setProfile]=useState(true);
 window.setProbeSpeaking=setTalking;window.closeProbeProfile=()=>setProfile(false);
 return React.createElement('main',{style:{display:'flex',gap:60}},...ids.map((id,i)=>React.createElement(Avatar,{key:id,name:'Participant '+i,size:100,showDecoration:true,animateDecoration:talking,customization:{avatarDecorationId:id}})),profile&&React.createElement(Avatar,{name:'Profile',size:100,showDecoration:true,customization:{avatarDecorationId:ids[1]}}));
}
createRoot(document.getElementById('root')).render(React.createElement(Probe));
</script></body></html>
