appId: online.lumesocial.desktop
productName: Lume
artifactName: "${productName}-${version}-${arch}.${ext}"
directories:
  output: dist-electron
files:
  - dist/**/*
  - resources/**/*
  # Exclude host-compiled native module artifacts from the asar.
  # electron-rebuild (postinstall) compiles uiohook-napi for the build machine,
  # creating build/Release/*.node. node-gyp-build checks build/ BEFORE prebuilds/,
  # so if these directories enter the asar, the app crashes on every platform
  # (including the build platform after afterPack removes the unpacked file).
  - "!**/node_modules/uiohook-napi/build/**"
  - "!**/node_modules/uiohook-napi/build.bak/**"
  - "!**/node_modules/uiohook-napi/bin/**"
asarUnpack:
  - "**/*.node"
npmRebuild: false
afterPack: ./scripts/afterPack.js
# Releases are published in the official Lume repository. Windows uses the
# generated latest.yml feed; unsigned macOS builds retain manual downloads.
publish:
  provider: github
  owner: talismanbruno
  repo: lumesync
  releaseType: release
protocols:
  - name: Lume
    schemes:
      - lume
mac:
  category: public.app-category.social-networking
  minimumSystemVersion: "12.0"
  extendInfo:
    NSMicrophoneUsageDescription: "Lume precisa acessar o microfone para chamadas de voz."
    NSCameraUsageDescription: "Lume precisa acessar a câmera para chamadas de vídeo."
    NSAudioCaptureUsageDescription: "Lume precisa acessar o áudio do sistema para compartilhar o som da tela."
  target:
    - dmg
    - zip
win:
  icon: ./build/icon.ico
  target:
    - nsis
linux:
  icon: build/icons/
  target:
    - AppImage
    - deb
  category: Network
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Lume
