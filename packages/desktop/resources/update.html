<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lume — Atualizando</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: #f4fbfd;
      background:
        radial-gradient(circle at 50% 44%, rgba(31, 208, 236, .065), transparent 25%),
        linear-gradient(180deg, #050a0d 0%, #030608 100%);
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      -webkit-app-region: drag;
      user-select: none;
    }
    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background:
        linear-gradient(90deg, transparent 0, rgba(39, 209, 235, .035) 50%, transparent 100%) top / 100% 1px no-repeat,
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .009) 0, rgba(255, 255, 255, .009) 1px, transparent 1px, transparent 4px);
      opacity: .65;
    }
    .shell {
      width: min(404px, calc(100vw - 64px));
      padding: 44px 40px 36px;
      text-align: center;
      background: linear-gradient(180deg, rgba(9, 18, 22, .9), rgba(5, 11, 14, .82));
      border: 1px solid rgba(68, 214, 236, .12);
      border-radius: 28px;
      box-shadow: 0 34px 90px rgba(0, 0, 0, .42), inset 0 1px rgba(255, 255, 255, .025);
    }
    .mark {
      width: 92px;
      height: 92px;
      margin: 0 auto 28px;
      position: relative;
    }
    .mark::after {
      position: absolute;
      inset: 10px;
      z-index: -1;
      border-radius: 24px;
      background: rgba(37, 210, 239, .18);
      filter: blur(22px);
      content: "";
    }
    .brand-icon {
      width: 92px;
      height: 92px;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 16px 26px rgba(0, 0, 0, .45));
    }
    .eyebrow {
      color: #31d2ed;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 { margin: 12px 0 8px; font-size: 26px; line-height: 1.15; letter-spacing: -.035em; }
    p { margin: 0; min-height: 22px; color: #91a3aa; font-size: 13px; }
    .track {
      height: 4px;
      margin-top: 30px;
      overflow: hidden;
      border-radius: 99px;
      background: #132126;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, .45);
    }
    .bar {
      width: 18%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #0ca9c4, #35dcf6);
      box-shadow: 0 0 14px rgba(39, 212, 240, .4);
      transition: width .28s ease;
    }
    .bar.indeterminate { animation: scan 1.35s ease-in-out infinite; }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 13px;
    }
    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #2bd5ef;
      box-shadow: 0 0 10px rgba(43, 213, 239, .72);
    }
    .percent { color: #71868e; font-size: 10px; font-weight: 650; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
    .note { margin: 27px 0 0; color: #52636a; font-size: 10px; }
    @keyframes scan { 0% { transform: translateX(-120%); } 50% { transform: translateX(230%); } 100% { transform: translateX(520%); } }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none !important; } }
  </style>
</head>
<body>
  <main class="shell" aria-live="polite">
    <div class="mark" aria-hidden="true"><img class="brand-icon" src="lume-logo.png" alt="" /></div>
    <div class="eyebrow">Atualização do Lume</div>
    <h1 id="title">Preparando o Lume</h1>
    <p id="message">Procurando novidades para você…</p>
    <div class="track"><div id="bar" class="bar indeterminate"></div></div>
    <div class="status"><span class="status-dot"></span><div id="percent" class="percent">VERIFICANDO</div></div>
    <div class="note">Pode deixar com a gente. O Lume abre sozinho.</div>
  </main>
  <script>
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const bar = document.getElementById('bar');
    const percent = document.getElementById('percent');

    function downloading(version) {
      title.textContent = 'Tem novidade chegando';
      message.textContent = version ? `Baixando a versão ${version}…` : 'Baixando a atualização…';
      percent.textContent = 'INICIANDO DOWNLOAD';
    }
    function installing(version) {
      title.textContent = 'Tudo pronto';
      message.textContent = version ? `Instalando a versão ${version}.` : 'Instalando a atualização.';
      bar.classList.remove('indeterminate');
      bar.style.width = '100%';
      percent.textContent = 'REABRINDO O LUME';
    }

    window.backspace?.rendererReady();
    window.backspace?.onUpdateAvailable(({ version }) => downloading(version));
    window.backspace?.onUpdateProgress(({ percent: value }) => {
      const rounded = Math.max(0, Math.min(100, Math.round(value)));
      bar.classList.remove('indeterminate');
      bar.style.width = `${Math.max(3, rounded)}%`;
      percent.textContent = `${rounded}%`;
    });
    window.backspace?.onUpdateDownloaded(({ version }) => installing(version));
    window.backspace?.onUpdateError(() => {
      title.textContent = 'Abrindo o Lume';
      message.textContent = 'A atualização fica para depois.';
      percent.textContent = 'CONTINUANDO';
    });
    window.backspace?.getRecoveryState().then((state) => {
      if (state.updateState === 'downloading') downloading(state.updateVersion);
      if (state.updateState === 'downloaded') installing(state.updateVersion);
    }).catch(() => {});
  </script>
</body>
</html>
