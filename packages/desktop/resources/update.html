<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lume — Atualizando</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: #f3f5ff;
      background:
        radial-gradient(circle at 50% 38%, rgba(123, 230, 255, .15), transparent 27%),
        radial-gradient(circle at 18% 88%, rgba(138, 112, 255, .18), transparent 36%),
        radial-gradient(circle at 88% 10%, rgba(255, 102, 143, .09), transparent 25%),
        #090c1b;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      -webkit-app-region: drag;
      user-select: none;
    }
    .shell { width: min(430px, calc(100vw - 64px)); text-align: center; }
    .mark {
      width: 108px; height: 108px; margin: 0 auto 30px; position: relative;
      display: grid; place-items: center;
    }
    .halo, .halo::after {
      position: absolute; inset: -7px -15px; border: 1px solid rgba(123, 230, 255, .28);
      border-radius: 50%; content: ""; transform: rotate(-14deg);
    }
    .halo { animation: orbit 4.8s linear infinite; }
    .halo::after { inset: 12px 4px; border-color: rgba(138, 112, 255, .34); animation: orbit 3.4s linear infinite reverse; }
    .spark {
      position: absolute; width: 8px; height: 8px; top: 2px; left: 47px;
      border-radius: 50%; background: #ff668f; box-shadow: 0 0 20px rgba(255, 102, 143, .8);
    }
    .brand-icon { width: 76px; height: 76px; position: relative; z-index: 2; object-fit: contain; filter: drop-shadow(0 14px 28px rgba(5, 7, 20, .58)); }
    .eyebrow { color: #7be6ff; font-size: 11px; font-weight: 750; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 12px 0 8px; font-size: 27px; letter-spacing: -.035em; }
    p { margin: 0; min-height: 24px; color: #b9c1df; font-size: 14px; }
    .track {
      height: 5px; margin-top: 28px; overflow: hidden; border-radius: 99px;
      background: rgba(141,150,181,.14);
    }
    .bar {
      width: 18%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #8a70ff, #7be6ff 58%, #ff668f);
      box-shadow: 0 0 20px rgba(123,230,255,.38);
      transition: width .28s ease;
    }
    .bar.indeterminate { animation: scan 1.35s ease-in-out infinite; }
    .percent { margin-top: 11px; color: #8d96b5; font-size: 11px; font-variant-numeric: tabular-nums; }
    .note { position: fixed; bottom: 28px; color: #687398; font-size: 11px; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes scan { 0% { transform: translateX(-120%); } 50% { transform: translateX(230%); } 100% { transform: translateX(520%); } }
    @media (prefers-reduced-motion: reduce) { .halo, .halo::after, .bar { animation: none !important; } }
  </style>
</head>
<body>
  <main class="shell" aria-live="polite">
    <div class="mark" aria-hidden="true"><div class="halo"><span class="spark"></span></div><img class="brand-icon" src="lume-mark.svg" alt="" /></div>
    <div class="eyebrow">Atualização Lume</div>
    <h1 id="title">Preparando o Lume</h1>
    <p id="message">Procurando novidades para você…</p>
    <div class="track"><div id="bar" class="bar indeterminate"></div></div>
    <div id="percent" class="percent">VERIFICANDO</div>
  </main>
  <div class="note">Você não precisa fazer nada. O Lume abre sozinho.</div>
  <script>
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const bar = document.getElementById('bar');
    const percent = document.getElementById('percent');

    function downloading(version) {
      title.textContent = 'Tem novidade chegando';
      message.textContent = version ? `Baixando a versão ${version}…` : 'Baixando a atualização…';
      percent.textContent = 'INICIANDO DOWNLOAD';
    }
    function installing(version) {
      title.textContent = 'Tudo pronto';
      message.textContent = version ? `Instalando a versão ${version}.` : 'Instalando a atualização.';
      bar.classList.remove('indeterminate');
      bar.style.width = '100%';
      percent.textContent = 'REABRINDO O LUME';
    }

    window.backspace?.rendererReady();
    window.backspace?.onUpdateAvailable(({ version }) => downloading(version));
    window.backspace?.onUpdateProgress(({ percent: value }) => {
      const rounded = Math.max(0, Math.min(100, Math.round(value)));
      bar.classList.remove('indeterminate');
      bar.style.width = `${Math.max(3, rounded)}%`;
      percent.textContent = `${rounded}%`;
    });
    window.backspace?.onUpdateDownloaded(({ version }) => installing(version));
    window.backspace?.onUpdateError(() => {
      title.textContent = 'Abrindo o Lume';
      message.textContent = 'A atualização fica para depois.';
      percent.textContent = 'CONTINUANDO';
    });
    window.backspace?.getRecoveryState().then((state) => {
      if (state.updateState === 'downloading') downloading(state.updateVersion);
      if (state.updateState === 'downloaded') installing(state.updateVersion);
    }).catch(() => {});
  </script>
</body>
</html>
