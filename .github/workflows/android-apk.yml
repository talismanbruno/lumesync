name: Lume Android APK

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Test and build APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/lume-mobile-${GITHUB_REF_NAME:-manual}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lume-mobile-apk
          path: android/app/build/outputs/apk/debug/lume-mobile-*.apk
          if-no-files-found: error
      - name: Publish tagged APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          android/app/build/outputs/apk/debug/lume-mobile-*.apk
          --title "Lume Mobile ${GITHUB_REF_NAME#android-v}"
          --notes "Beta Android focada em chamadas e compartilhamento nativo de tela. Instalação direta para testes."
          --prerelease
