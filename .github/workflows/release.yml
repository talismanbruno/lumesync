name: Lume Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lume-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
      - id: version
        name: Check release versions
        run: node scripts/verify-release.mjs version
      - name: Test release validation
        run: node --test scripts/verify-release.test.mjs

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Mac architectures share one job and update feed.
          - os: macos-15
            args: --mac --arm64 --x64
          # Native rebuild tooling requires VS 2022.
          - os: windows-2022
            args: --win --x64 --arm64
          - os: ubuntu-latest
            args: --linux --x64
          - os: ubuntu-24.04-arm
            args: --linux --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux native build and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxt-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libxrandr-dev libxinerama-dev libx11-xcb-dev ruby ruby-dev build-essential
          sudo gem install --no-document fpm
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @backspace/shared build
      - name: Compile and test desktop
        working-directory: packages/desktop
        run: |
          pnpm exec tsc
          pnpm test
      - name: Package desktop without publishing partial releases
        working-directory: packages/desktop
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          USE_SYSTEM_FPM: 'true'
      - name: Verify packaged desktop versions
        run: node scripts/verify-release.mjs desktop packages/desktop/dist-electron
      - name: Check DMG integrity
        if: runner.os == 'macOS'
        run: |
          for dmg in packages/desktop/dist-electron/*.dmg; do hdiutil verify "$dmg"; done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/dist-electron/*.exe
            packages/desktop/dist-electron/*.dmg
            packages/desktop/dist-electron/*.zip
            packages/desktop/dist-electron/*.AppImage
            packages/desktop/dist-electron/*.deb
            packages/desktop/dist-electron/*.blockmap
            packages/desktop/dist-electron/beta*.yml
            packages/desktop/dist-electron/latest*.yml

  android:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.11.1'
      - name: Test and build beta APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Verify APK version and signature
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-version.txt
          head -1 /tmp/apk-version.txt
          grep -F "versionName='$RELEASE_VERSION'" /tmp/apk-version.txt
          "$tools/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk
          mkdir release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-apk/Lume-$RELEASE_VERSION-android.apk"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-android
          path: release-apk/*.apk
          if-no-files-found: error

  draft:
    needs: [validate, desktop, android]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/finalize-release.yml
    with:
      build_run_id: ${{ format('{0}', github.run_id) }}
      source_sha: ${{ github.sha }}
