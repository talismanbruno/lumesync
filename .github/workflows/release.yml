name: Lume Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lume-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.34.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
      - id: version
        name: Check release versions
        run: node scripts/verify-release.mjs version
      - name: Test release validation
        run: node --test scripts/verify-release.test.mjs

  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Mac architectures share one job and update feed.
          - os: macos-15
            args: --mac --arm64 --x64
          # Native rebuild tooling requires VS 2022.
          - os: windows-2022
            args: --win --x64 --arm64
          - os: ubuntu-latest
            args: --linux --x64
          - os: ubuntu-24.04-arm
            args: --linux --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install Linux native build and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxt-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libxrandr-dev libxinerama-dev libx11-xcb-dev ruby ruby-dev build-essential
          sudo gem install --no-document fpm
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.34.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @backspace/shared build
      - name: Compile and test desktop
        working-directory: packages/desktop
        run: |
          pnpm exec tsc
          pnpm test
      - name: Package desktop without publishing partial releases
        working-directory: packages/desktop
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          USE_SYSTEM_FPM: 'true'
      - name: Verify packaged desktop versions
        run: node scripts/verify-release.mjs desktop packages/desktop/dist-electron
      - name: Check DMG integrity
        if: runner.os == 'macOS'
        run: |
          for dmg in packages/desktop/dist-electron/*.dmg; do hdiutil verify "$dmg"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            packages/desktop/dist-electron/*.exe
            packages/desktop/dist-electron/*.dmg
            packages/desktop/dist-electron/*.zip
            packages/desktop/dist-electron/*.AppImage
            packages/desktop/dist-electron/*.deb
            packages/desktop/dist-electron/*.blockmap
            packages/desktop/dist-electron/beta*.yml
            packages/desktop/dist-electron/latest*.yml

  android:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - name: Test and build beta APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Verify APK version and signature
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > /tmp/apk-version.txt
          head -1 /tmp/apk-version.txt
          grep -F "versionName='$RELEASE_VERSION'" /tmp/apk-version.txt
          "$tools/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk
          mkdir release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-apk/Lume-$RELEASE_VERSION-android.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-android
          path: release-apk/*.apk
          if-no-files-found: error

  draft:
    needs: [validate, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify downloads and write checksums
        run: node scripts/verify-release.mjs assets release-assets
      - name: Create complete release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
            test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title "Lume Beta 20" --notes-file "docs/releases/$tag.md"
          fi
          gh release upload "$tag" release-assets/* --clobber
